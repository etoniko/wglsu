<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Запуск игры — wgl.su</title>
<meta name="robots" content="noindex, follow">
<link rel="icon" href="/icon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600&family=Syne:wght@800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0604;
  --ink: #f3ebe3;
  --muted: rgba(243, 235, 227, 0.72);
  --accent: #e11d2e;
  --hot: #ffb347;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; height: 100%;
  background: var(--bg); overflow: hidden;
  font-family: "Sora", sans-serif; color: var(--ink);
}
iframe {
  width: 100vw; height: 100vh; border: none;
  display: none; background: #000;
}
.wrapper {
  position: fixed; inset: 0;
  display: flex; align-items: center; justify-content: center;
  flex-direction: column; text-align: center; padding: 24px;
  background:
    radial-gradient(circle at 70% 20%, rgba(225, 29, 46, 0.22), transparent 40%),
    linear-gradient(160deg, #0a0604, #1a100c 55%, #2a1810),
    url("/brand/bear-hero.jpg") center / cover;
  background-blend-mode: normal, normal, soft-light;
  animation: fadeIn 0.45s ease;
}
.brand {
  font-family: "Syne", sans-serif; font-weight: 800;
  font-size: 1.1rem; letter-spacing: -0.04em;
  margin-bottom: 28px; color: var(--hot);
}
.loader {
  width: 34px; height: 34px;
  border: 3px solid rgba(243, 235, 227, 0.2);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.75s linear infinite;
  margin-bottom: 18px;
}
.message {
  font-size: 0.95rem; color: var(--muted);
  white-space: pre-line; max-width: 28ch;
}
.home {
  margin-top: 22px; color: var(--ink);
  font-size: 0.85rem; font-weight: 600;
  text-decoration: none; opacity: 0.75;
}
.home:hover { opacity: 1; }

/* LK play timer — top right, semi-transparent */
.play-timer {
  position: fixed;
  top: 14px;
  right: 14px;
  z-index: 50;
  display: none;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  border-radius: 12px;
  background: rgba(10, 6, 4, 0.45);
  border: 1px solid rgba(243, 235, 227, 0.14);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  color: rgba(243, 235, 227, 0.88);
  font-size: 0.82rem;
  font-weight: 600;
  letter-spacing: 0.02em;
  pointer-events: none;
  user-select: none;
}
.play-timer.is-on { display: inline-flex; }
.play-timer__dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 0 3px rgba(225, 29, 46, 0.25);
  animation: pulse 1.4s ease infinite;
}
.play-timer__label {
  opacity: 0.7;
  font-weight: 500;
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}
.play-timer__time {
  font-variant-numeric: tabular-nums;
  color: var(--hot);
  min-width: 5.5ch;
}

@keyframes spin { to { transform: rotate(360deg); } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.55; transform: scale(0.85); }
}
</style>
</head>
<body>

<iframe id="gameFrame" title="Игра" allowfullscreen></iframe>

<div id="playTimer" class="play-timer" aria-live="polite">
  <span class="play-timer__dot" aria-hidden="true"></span>
  <span class="play-timer__label">ЛК</span>
  <span class="play-timer__time" id="playTimerValue">00:00</span>
</div>

<div id="status" class="wrapper">
  <div class="brand">WGL.su</div>
  <div class="loader" aria-hidden="true"></div>
  <div class="message">Загрузка игры…</div>
  <a class="home" href="/">← на главную</a>
</div>

<script>
const iframe = document.getElementById("gameFrame");
const status = document.getElementById("status");
const message = status.querySelector(".message");
const playTimer = document.getElementById("playTimer");
const playTimerValue = document.getElementById("playTimerValue");

function goHome() { location.href = "/"; }

function codeFromPath() {
  const m = location.pathname.match(/\/g\/([a-zA-Z0-9]{3,8})\/?$/);
  if (m) return m[1].toLowerCase();
  const q = new URLSearchParams(location.search);
  return (q.get("game") || q.get("code") || "").toLowerCase();
}

function formatTimer(ms) {
  const s = Math.floor(ms / 1000);
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = s % 60;
  if (h > 0) return `${h}:${String(m).padStart(2, "0")}:${String(sec).padStart(2, "0")}`;
  return `${String(m).padStart(2, "0")}:${String(sec).padStart(2, "0")}`;
}

async function resolveGame() {
  const code = codeFromPath();
  if (!code) return null;
  const res = await fetch(`/api/g/${encodeURIComponent(code)}`);
  if (!res.ok) return null;
  const data = await res.json();
  return data.game || null;
}

function showGame(url) {
  let loaded = false;
  iframe.src = url;
  iframe.onload = () => {
    loaded = true;
    status.style.display = "none";
    iframe.style.display = "block";
  };
  iframe.onerror = () => {
    message.textContent = "Ошибка загрузки\nВозврат на главную…";
    setTimeout(goHome, 2500);
  };
  setTimeout(() => {
    if (!loaded) {
      message.textContent = "Игра загружается дольше обычного…";
      status.style.display = "none";
      iframe.style.display = "block";
    }
  }, 4000);
}

function startPlayTracking(game) {
  const token = localStorage.getItem("wgl_token");
  if (!token || !game) return;

  playTimer.classList.add("is-on");
  let sessionMs = 0;
  playTimerValue.textContent = formatTimer(0);

  const headers = {
    "Content-Type": "application/json",
    Authorization: "Bearer " + token,
  };

  fetch("/api/play/start", {
    method: "POST",
    headers,
    body: JSON.stringify({ gameId: game.code || game.id, url: game.url }),
  }).catch(() => {});

  let last = Date.now();
  setInterval(() => {
    if (document.hidden) {
      last = Date.now();
      return;
    }
    const now = Date.now();
    const deltaMs = now - last;
    last = now;
    sessionMs += deltaMs;
    playTimerValue.textContent = formatTimer(sessionMs);

    fetch("/api/play/heartbeat", {
      method: "POST",
      headers,
      body: JSON.stringify({ game: game.code || game.id, deltaMs }),
    }).catch(() => {});
  }, 1000);

  // server credit every 30s is enough; UI ticks every 1s locally
  // but heartbeat every 1s would hit rate limit (25s min). So local timer + heartbeat 30s:
}

function startPlayTrackingSafe(game) {
  const token = localStorage.getItem("wgl_token");
  if (!token || !game) return;

  playTimer.classList.add("is-on");
  let sessionMs = 0;
  playTimerValue.textContent = formatTimer(0);

  const headers = {
    "Content-Type": "application/json",
    Authorization: "Bearer " + token,
  };

  fetch("/api/play/start", {
    method: "POST",
    headers,
    body: JSON.stringify({ gameId: game.code || game.id, url: game.url }),
  }).catch(() => {});

  const tick = setInterval(() => {
    if (document.hidden) return;
    sessionMs += 1000;
    playTimerValue.textContent = formatTimer(sessionMs);
  }, 1000);

  let lastBeat = Date.now();
  setInterval(() => {
    if (document.hidden) {
      lastBeat = Date.now();
      return;
    }
    const now = Date.now();
    const deltaMs = now - lastBeat;
    lastBeat = now;
    fetch("/api/play/heartbeat", {
      method: "POST",
      headers,
      body: JSON.stringify({ game: game.code || game.id, deltaMs }),
    }).catch(() => {});
  }, 30000);

  window.addEventListener("beforeunload", () => clearInterval(tick));
}

(async function boot() {
  try {
    const game = await resolveGame();
    if (!game) {
      message.textContent = "Игра не найдена\nВозврат на главную…";
      setTimeout(goHome, 2200);
      return;
    }
    document.title = `${game.name} — wgl.su`;
    showGame(game.url);
    startPlayTrackingSafe(game);
  } catch {
    message.textContent = "Ошибка\nВозврат на главную…";
    setTimeout(goHome, 2200);
  }
})();
</script>
</body>
</html>

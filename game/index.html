<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<title>Запуск игры — wgl.su</title>
<meta name="robots" content="noindex, follow">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="/icon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600&family=Syne:wght@800&display=swap" rel="stylesheet">
<link href="/assets/play-launch.css?5" rel="stylesheet">
</head>
<body>

<div id="gameStage">
  <div id="gameFit">
    <iframe id="gameFrame" title="Игра" allowfullscreen playsinline referrerpolicy="no-referrer"></iframe>
  </div>
</div>

<div id="playTimer" class="play-timer" aria-live="polite">
  <span class="play-timer__dot" aria-hidden="true"></span>
  <span class="play-timer__label">ЛК</span>
  <span class="play-timer__time" id="playTimerValue">00:00</span>
</div>

<div id="status" class="wrapper">
  <div class="brand">WGL.su</div>
  <div class="loader" aria-hidden="true"></div>
  <div class="message">Запуск игры…</div>
  <a class="home" href="/">← на главную</a>
</div>

<div id="notFound" class="not-found" hidden>
  <div>
    <p>Игра не указана</p>
    <p><a class="home" href="/">← на главную</a></p>
  </div>
</div>

<script src="/assets/play-launch.js?5"></script>
</body>
</html>

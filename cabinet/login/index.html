<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вход — WGL.su</title>
<link rel="icon" href="/icon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<link href="/assets/style.css?9" rel="stylesheet">
<link href="/cabinet/cabinet.css?2" rel="stylesheet">
</head>
<body>
<div class="site-bg" aria-hidden="true"></div>
<header class="topbar">
  <a class="brand" href="/" aria-label="Web Game Link">
    <img class="brand-logo" src="/icon.png" alt="" width="40" height="40">
    <span class="brand-mark">WGL<span class="brand-dot">.su</span></span>
    <span class="brand-tagline">вход</span>
  </a>
  <div class="topbar-actions">
    <a class="btn btn-ghost" href="/cabinet/register/">Регистрация</a>
    <button class="theme-toggle" type="button" onclick="toggleTheme()" aria-label="Сменить тему">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v2M12 19v2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M3 12h2M19 12h2M5.6 18.4l1.4-1.4M17 7l1.4-1.4"/><circle cx="12" cy="12" r="4"/></svg>
    </button>
  </div>
</header>

<main class="cabinet">
  <section class="cab-auth">
    <div class="cab-auth-card">
      <h1 class="cab-title">Вход</h1>
      <p class="cab-lead">Войди в личный кабинет. Максимум 2 активных сеанса.</p>
      <form id="loginForm" class="cab-form">
        <label>Ник <input name="nick" autocomplete="username" required minlength="3" maxlength="20"></label>
        <label>Пароль <input name="password" type="password" autocomplete="current-password" required minlength="6"></label>
        <button class="btn btn-primary" type="submit">Войти</button>
      </form>
      <p class="cab-error" id="authError" hidden></p>
      <p class="cab-hint" style="margin-top:16px">Нет аккаунта? <a href="/cabinet/register/">Регистрация</a></p>
    </div>
  </section>
</main>
<script src="/cabinet/auth-shared.js?1"></script>
<script>
if (localStorage.getItem("wgl_token")) location.replace("/cabinet/");
document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const err = document.getElementById("authError");
  err.hidden = true;
  const fd = new FormData(e.target);
  try {
    const data = await api("/api/login", {
      method: "POST",
      body: { nick: fd.get("nick"), password: fd.get("password") },
    });
    localStorage.setItem("wgl_token", data.token);
    location.href = "/cabinet/";
  } catch (ex) {
    err.hidden = false;
    err.textContent = ex.message;
  }
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WGL.su</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/icon.png" type="image/png">
<style>
  html, body { margin: 0; min-height: 100%; background: #0a0604; color: #f3ebe3; font-family: system-ui, sans-serif; }
  .wrap { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 24px; }
  a { color: #ffb347; }
</style>
<script>
(function () {
  var p = location.pathname || "/";
  var m = p.match(/^\/id(\d+)\/?$/i);
  if (m) {
    location.replace("/user/?id=" + m[1] + location.search.replace(/^\?/, "&") + location.hash);
    return;
  }
  m = p.match(/^\/user\/(?:id)?(\d+)\/?$/i);
  if (m) {
    location.replace("/user/?id=" + m[1] + location.search.replace(/^\?/, "&") + location.hash);
    return;
  }
  m = p.match(/^\/g\/([a-zA-Z0-9]{3,8})\/?$/);
  if (m) {
    location.replace("/game/?code=" + encodeURIComponent(m[1].toLowerCase()) + location.search.replace(/^\?/, "&") + location.hash);
    return;
  }
})();
</script>
</head>
<body>
  <div class="wrap">
    <div>
      <p>Страница не найдена</p>
      <p><a href="/">← на главную</a></p>
    </div>
  </div>
</body>
</html>
